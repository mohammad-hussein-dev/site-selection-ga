[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "site-selection-ga"
version = "0.1.0"
description = "Optimal school site selection using Genetic Algorithm"
authors = [{name = "Mohammad Hussein", email = "king.mohamd.09876@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "deap>=1.4.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0"
]

[project.urls]
Homepage = "https://github.com/mohammad-hussein-dev/site-selection-ga"
Repository = "https://github.com/mohammad-hussein-dev/site-selection-ga.git"
Issues = "https://github.com/mohammad-hussein-dev/site-selection-ga/issues"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "I001"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
